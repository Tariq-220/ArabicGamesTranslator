plugins { id 'com.android.application' }
android {
 namespace 'dev.arabicgames.phone'
 compileSdk 35
 buildFeatures { buildConfig true }
 sourceSets { main.java.srcDir '../shared/src/main/java' }
 defaultConfig { applicationId 'dev.arabicgames.phone'; minSdk 26; targetSdk 35; versionCode 27; versionName '0.4.15'; ndk { abiFilters 'arm64-v8a' } }
 splits { abi { enable false } }
 signingConfigs { debug { enableV1Signing true; enableV2Signing true; enableV3Signing true; enableV4Signing false } }
 buildTypes {
  debug { debuggable false; jniDebuggable false }
  release { debuggable false; jniDebuggable false; minifyEnabled false; signingConfig signingConfigs.debug }
 }
 testOptions { unitTests.includeAndroidResources = true
  unitTests.all {
   maxHeapSize = '1g'
   systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
   ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort','javax.net.ssl.trustStore'].each { key -> if(System.getProperty(key)) systemProperty key,System.getProperty(key) }
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 testImplementation 'org.robolectric:robolectric:4.14.1'

 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 implementation 'com.google.zxing:core:3.5.3'
 implementation project(':common')
 implementation 'com.google.mlkit:text-recognition:16.0.1'
 implementation 'com.google.mlkit:translate:17.0.3'
 implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
