plugins { id 'com.android.application' }
android {
 namespace 'dev.arabicgames.tv'
 compileSdk 35
 buildFeatures { buildConfig true }
 signingConfigs { debug { enableV1Signing true; enableV2Signing true } }
 sourceSets { main.java.srcDir '../shared/src/main/java' }
 defaultConfig { applicationId 'dev.arabicgames.tv'; minSdk 26; targetSdk 35; versionCode 33; versionName '0.4.5' }
 buildTypes {
  debug { debuggable false; jniDebuggable false }
  release { debuggable false; jniDebuggable false; minifyEnabled false; signingConfig signingConfigs.debug }
 }
 testOptions { unitTests.includeAndroidResources = true
  unitTests.all {
   maxHeapSize = '1g'
   systemProperty 'robolectric.dependency.repo.url', System.getenv('ROBOLECTRIC_REPO') ?: 'https://repo.maven.apache.org/maven2'
   ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort','javax.net.ssl.trustStore'].each { key -> if(System.getProperty(key)) systemProperty key,System.getProperty(key) }
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
 implementation project(':common') }
