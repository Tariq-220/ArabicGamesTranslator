name: خطأ في الترجمة
description: شارك خطأ أو تصحيحًا ليستفيد منه مستخدمو الجوال وويندوز بعد المراجعة
title: '[ترجمة] اسم اللعبة'
labels: ['translation-review']
body:
 - type: markdown
   attributes:
     value: 'هذا البلاغ علني واختياري. الصق السطر من زر الإبلاغ في التطبيق، وأضف التصحيح إن عرفته. نجمع البلاغات المتشابهة ونراجع التعارضات، ثم ننشر التصحيح المعتمد للجوال وويندوز. لا ترفق مفاتيح API أو رموز ربط أو صورًا أو بيانات حساب.'
 - type: textarea
   id: report
   attributes:
     label: بيانات البلاغ
     description: الصق بيانات السطر من زر الإبلاغ في التطبيق أو اكتب الإنجليزي والترجمة والمحرك واسم اللعبة.
   validations:
     required: true
 - type: textarea
   id: proposal
   attributes:
     label: الترجمة العربية الصحيحة المقترحة
     description: اكتب الترجمة نفسها فقط. اتركها فارغة إذا كنت تبلغ عن خطأ دون معرفة التصحيح.
 - type: textarea
   id: correction
   attributes:
     label: التصحيح المقترح والسياق
     description: التصحيح اختياري. اذكر المقصود في مشهد اللعبة إن أمكن.
 - type: checkboxes
   id: public_report
   attributes:
     label: مشاركة التصحيح
     options:
       - label: أفهم أن البلاغ علني، وراجعت النص للتأكد من خلوه من المفاتيح وبيانات الحساب والربط.
         required: true
