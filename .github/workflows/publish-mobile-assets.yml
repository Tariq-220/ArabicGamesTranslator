name: Publish locally signed Android packages
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Temporary release-binaries branch containing the signed APKs'
        required: true
      release_tag:
        description: 'Existing release tag'
        required: true
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$SOURCE_REF" =~ ^release-binaries-[a-zA-Z0-9.-]+$ ]] || exit 1
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Verify signed package bytes and archive structure
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.release-binaries')
          files=json.loads((root/'manifest.json').read_text())
          assert set(files)=={'ArabicGames-Phone-arm64.apk','ArabicGames-TV.apk'}
          for name,digest in files.items():
              p=root/name
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None and 'AndroidManifest.xml' in z.namelist()
          PY
      - name: Attach packages to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" .release-binaries/ArabicGames-Phone-arm64.apk .release-binaries/ArabicGames-TV.apk --repo '${{ github.repository }}'
