name: Publish illustrated Arabic setup guide
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: arabic-guide-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download the public guide from the completed stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(python -c "import json;print(json.load(open('release/version.json'))['version'])")"
          gh release view "$TAG" --json isDraft --jq .isDraft | grep -qx false
          gh release download "$TAG" --pattern ArabicGames-Arabic-Guide.zip --dir guide-download
          python -c "import zipfile,pathlib;z=zipfile.ZipFile('guide-download/ArabicGames-Arabic-Guide.zip');assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist());assert sum(i.file_size for i in z.infolist())<50000000;z.extractall('public-guide')"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public-guide
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
