name: Collect voluntary translation corrections
on:
  workflow_dispatch:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  issues: read
concurrency:
  group: community-feedback-index
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'translation-review') || github.event.label.name == 'translation-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate collection and review boundaries
        run: |
          python scripts/test-feedback-collection.py
          python scripts/test-community-review.py
      - name: Collect only public voluntary reports as unreviewed data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/collect-community-feedback.py
      - name: Save pending review index
        run: |
          git config user.name 'ArabicGames feedback collection'
          git config user.email 'feedback-collection@users.noreply.github.com'
          git add community/pending-feedback.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Collect voluntary corrections for maintainer review'
          git push origin HEAD:main
