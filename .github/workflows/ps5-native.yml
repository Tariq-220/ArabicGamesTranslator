name: Build pinned Android PS5 native engine
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build verified source and native engine
        run: bash scripts/build-android-ps5-native.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ps5-native-arm64
          path: out/ps5-native.zip
          retention-days: 30
      - name: Public native library transport fallback
        run: |
          python - <<'PY'
          import base64
          data=base64.b64encode(open('out/ps5-native.zip','rb').read()).decode()
          print('PS5_NATIVE_TRANSPORT_BEGIN')
          for i in range(0,len(data),120):print('PS5_NATIVE64 '+data[i:i+120])
          print('PS5_NATIVE_TRANSPORT_END')
          PY
