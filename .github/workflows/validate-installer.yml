name: Validate installer and activation scripts
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/validate-installer.yml', 'installer/**', 'release/Enable-AutoUpdate.ps1', 'release/Enable-AutoUpdate.cmd']
permissions:
  contents: write
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          foreach($file in @('installer/Install.ps1','release/Enable-AutoUpdate.ps1')) {
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$null,[ref]$errors)
            if($errors.Count){$errors|Format-List;throw "Invalid script: $file"}
          }
      - name: Test installer files and rollback with OS operations mocked
        shell: pwsh
        run: ./installer/Test-Installer.ps1
      - name: Publish activation helper through the Actions token
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $info=Get-Content release/version.json -Raw|ConvertFrom-Json
          $file=Join-Path $env:RUNNER_TEMP 'ArabicGames-Enable-AutoUpdate.zip'
          Compress-Archive -Path release/Enable-AutoUpdate.cmd,release/Enable-AutoUpdate.ps1 -DestinationPath $file -Force
          gh release upload "v$($info.version)" $file --repo '${{ github.repository }}' --clobber
          if($LASTEXITCODE -ne 0){throw 'Could not upload activation helper'}
