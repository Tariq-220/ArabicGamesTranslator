name: Build verified local Android translation engines
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build pinned CTranslate2 runtime and model smoke tests
        run: bash scripts/build-android-ct2-native.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ct2-native-android
          path: out/ct2-native.zip
          retention-days: 30
      - name: Public local engine transport fallback
        run: |
          python - <<'PY'
          import base64
          data=base64.b64encode(open('out/ct2-native.zip','rb').read()).decode()
          for i in range(0,len(data),120):print('CT2_NATIVE64 '+data[i:i+120])
          PY
