name: Rebuild validation (no installers)
on:
  push:
    branches: [rebuild/v024-vi]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rebuild-validation
  cancel-in-progress: true
jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile desktop projects (no publish or installers)
        run: dotnet build windows/src/GameTranslator.App/GameTranslator.App.csproj -c Release
      - name: Render and validate Arabic desktop navigation
        shell: pwsh
        run: |
          $exe=Resolve-Path windows/src/GameTranslator.App/bin/Release/net10.0-windows10.0.19041.0/win-x64/GameTranslator.exe
          $process=Start-Process $exe -ArgumentList '--render-arabic',"$env:RUNNER_TEMP/rebuild-screens" -PassThru -Wait
          if($process.ExitCode -ne 0){Get-Content "$env:RUNNER_TEMP/rebuild-screens/errors.txt" -ErrorAction SilentlyContinue;throw 'Arabic UI preview failed'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rebuild-ui-preview
          path: ${{ runner.temp }}/rebuild-screens
          if-no-files-found: ignore
      - name: Save demo-only screens for visual review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/save-rebuild-previews.py
      - name: Dialogue and independent region regression tests
        run: dotnet test windows/tests/GameTranslator.Core.Tests/GameTranslator.Core.Tests.csproj -c Release --filter "FullyQualifiedName~SubtitlePipelineTests|FullyQualifiedName~SubtitleStabilizerTests|FullyQualifiedName~TranslationIsolationTests|FullyQualifiedName~ReadingAreaTests|FullyQualifiedName~XboxNavigationTests|FullyQualifiedName~TranslationWorkQueueTests|FullyQualifiedName~SpellScoringTests|FullyQualifiedName~LanDiscoveryTests|FullyQualifiedName~SubtitleServerTests"
      - name: Preview lifecycle and persistence
        run: dotnet test windows/tests/GameTranslator.Shell.Tests/GameTranslator.Shell.Tests.csproj -c Release --filter "FullyQualifiedName~RebuildPreviewTests"
      - name: Translation quality validation
        run: dotnet test windows/tests/GameTranslator.Translation.Tests/GameTranslator.Translation.Tests.csproj -c Release --filter "FullyQualifiedName~ArabicOutputQualityTests|FullyQualifiedName~ArabicSpeakerTests|FullyQualifiedName~DeepLTranslatorTests|FullyQualifiedName~CloudFailureTests|FullyQualifiedName~ModelCompatibilityTests|FullyQualifiedName~DialogueReadingRegressionTests|FullyQualifiedName~ReadingRecoveryTests|FullyQualifiedName~ArabicDesktopUpdateTests|FullyQualifiedName~ComparisonLogTests"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: TV and LAN protocol tests (no APK packaging)
        working-directory: android
        run: bash gradlew :common:test :tv:testDebugUnitTest --console=plain
      - name: Report individual test failures
        if: always()
        run: python scripts/rebuild-test-report.py

  local-model:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r local-engine/requirements.txt
      - run: python -m unittest discover -s local-engine -p "test_*.py"
      - run: python scripts/smoke-local-quickmt.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quickmt-real-model-smoke
          path: ${{ runner.temp }}/quickmt-smoke.json
